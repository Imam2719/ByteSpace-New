html,body{margin:0}

:root{--u:calc(100vw/1440)}
.bs-page{position:relative;font-family:'Outfit',sans-serif;color:#fff;overflow-x:clip}
.bs-grid{position:absolute;left:0;right:0;top:0;pointer-events:none;
 background-image:linear-gradient(90deg,rgba(255,255,255,.12) 2px,transparent 2px),linear-gradient(rgba(255,255,255,.12) 2px,transparent 2px);
 background-size:max(56px,calc(120*var(--u))) max(56px,calc(120*var(--u)));
 background-position:0 -2px;background-color:#003BE2}
.bs-in{position:relative;max-width:1440px;margin:0 auto;padding:0 clamp(20px,8.47vw,122px)}
.hd{position:relative;height:105px;z-index:5}
.hd-logo{position:absolute;left:-1px;top:33px;line-height:0;display:block}
.hd-logo img{width:176px;height:39px;display:block}
.hd-links{position:absolute;left:50%;top:60px;transform:translate(-50%,-50%);display:flex;gap:24px;white-space:nowrap}
.hd a{color:#fff;text-decoration:none;font-size:17px;line-height:24px;font-weight:300}
.hd-links a.on{transform:translateY(-3px);font-weight:400}
.hd-right{position:absolute;right:0;top:60px;transform:translateY(-50%);display:flex;align-items:center;gap:25px;white-space:nowrap}
.hd-right button{background:none;border:0;padding:0;margin-left:4px;cursor:pointer;line-height:0}
.bs-btn{display:inline-flex;align-items:center;justify-content:center;background:#D4FB20;color:#111;border:0;border-radius:999px;text-decoration:none;font-family:'Outfit',sans-serif;cursor:pointer;transition:filter .15s}
.bs-btn:hover{filter:brightness(.95)}
@media(max-width:820px){
 .hd{height:auto;padding:22px 0 8px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;row-gap:14px}
 .hd-logo,.hd-links,.hd-right{position:static;transform:none}
 .hd-logo img{width:148px;height:33px}
 .hd-links{order:3;width:100%;justify-content:center;gap:26px}
 .hd-links a.on{transform:none}
 .hd-right{gap:18px}
}

.nf{min-height:calc(957*var(--u))}
.nf .bs-grid{height:100%;background-image:none}
.nf-in{position:relative;height:calc(957*var(--u));max-width:none;padding:0}
.nf .hd-wrap{position:absolute;left:0;right:0;top:0;z-index:6}
.nf-404{position:absolute;left:0;right:0;top:calc(157*var(--u));text-align:center;font-family:'Plus Jakarta Sans','Outfit',sans-serif;font-weight:800;

 -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.nf-gridtop{position:absolute;inset:0;pointer-events:none;z-index:2;
 background-image:linear-gradient(90deg,rgba(255,255,255,.12) 2px,transparent 2px),linear-gradient(rgba(255,255,255,.12) 2px,transparent 2px);
 background-size:max(56px,calc(120*var(--u))) max(56px,calc(120*var(--u)));background-position:0 -2px}
.nf-copy{position:absolute;left:0;right:0;top:calc(511*var(--u));text-align:center;z-index:3}
.nf-copy h1{margin:0 auto;font-family:'Plus Jakarta Sans','Outfit',sans-serif;font-weight:600;font-size:calc(76*var(--u));line-height:calc(85*var(--u));letter-spacing:calc(-.8*var(--u));color:#fff;max-width:calc(900*var(--u))}
.nf-copy p{margin:calc(38*var(--u)) 0 0;font-size:calc(18*var(--u));line-height:calc(28*var(--u));font-weight:300;color:rgba(255,255,255,.92)}
.nf-copy .bs-btn{margin-top:calc(42*var(--u));height:calc(46*var(--u));width:calc(163*var(--u));padding:0;font-size:calc(18*var(--u));font-weight:400}
@media(max-width:820px){
 .nf,.nf-in{min-height:0;height:auto}
 .nf .hd-wrap{position:relative}
 .nf-404,.nf-copy{position:relative;top:auto}
 .nf-404{margin-top:26px;font-size:min(46vw,300px);line-height:1;background-size:100% 100%;background-position:0 0;letter-spacing:-.03em}
 .nf-copy{margin-top:-9vw;padding:0 22px 70px}
 .nf-copy h1{font-size:clamp(28px,8vw,52px);line-height:1.14;max-width:none}
 .nf-copy p{font-size:16px;line-height:24px;margin-top:20px}
 .nf-copy .bs-btn{height:46px;min-width:150px;font-size:18px;margin-top:26px}
}
